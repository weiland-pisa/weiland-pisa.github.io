<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punktetabelle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f3;
      color: #1a1a18;
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    h1 { font-size: 20px; font-weight: 500; margin-bottom: 1rem; }

    .wrap { max-width: 960px; margin: 0 auto; }

    .controls { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }

    button {
      font-family: inherit;
      font-size: 13px;
      padding: 7px 14px;
      border: 0.5px solid #ccc;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      color: #1a1a18;
      white-space: nowrap;
    }
    button:hover { background: #f0efea; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: default; }

    .tbl-outer {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 0.5px solid #dddbd2;
      border-radius: 12px;
      background: #fff;
    }

    table { border-collapse: collapse; table-layout: auto; width: 100%; }

    thead tr { border-bottom: 0.5px solid #c8c6be; }
    tfoot tr { border-top: 1px solid #b0aea6; background: #f5f5f3; }
    tbody tr:not(:last-child) { border-bottom: 0.5px solid #dddbd2; }
    tbody tr.empty-row { opacity: 0.4; }
    tbody tr:not(.empty-row):hover { background: #f9f8f5; }

    td, th { padding: 0; }

    .row-num {
      width: 36px;
      text-align: center;
      font-size: 11px;
      color: #888780;
      padding: 10px 2px;
    }

    .name-input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: #1a1a18;
      padding: 10px 6px;
      text-align: center;
      outline: none;
    }
    .name-input::placeholder { color: #b4b2a9; font-weight: 400; }
    .name-input:focus { background: #e6f1fb; color: #185fa5; }

    .score-input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      color: #1a1a18;
      padding: 9px 4px;
      text-align: center;
      outline: none;
      -moz-appearance: textfield;
    }
    .score-input::-webkit-inner-spin-button,
    .score-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .score-input:focus { background: #f0efea; }
    .score-input.neg { color: #a32d2d; }

    .total-cell {
      text-align: center;
      padding: 10px 4px;
      font-size: 14px;
      font-weight: 500;
      font-family: ui-monospace, monospace;
    }
    .total-cell.pos { color: #3b6d11; }
    .total-cell.neg { color: #a32d2d; }
    .total-cell.zero { color: #888780; }

    .rank-badge {
      display: inline-block;
      width: 18px; height: 18px;
      border-radius: 50%;
      font-size: 10px; font-weight: 500;
      text-align: center; line-height: 18px;
      margin-right: 2px;
    }
    .r1 { background: #FAC775; color: #633806; }
    .r2 { background: #D3D1C7; color: #2C2C2A; }
    .r3 { background: #F0997B; color: #4A1B0C; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Punktetabelle</h1>
  <div class="controls">
    <button id="addPlayerBtn">+ Spieler hinzufügen</button>
    <button id="resetScoresBtn">Punkte zurücksetzen</button>
    <button id="resetAllBtn">Alles zurücksetzen</button>
  </div>
  <div class="tbl-outer">
    <table id="tbl">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="tbody"></tbody>
      <tfoot><tr id="footRow"></tr></tfoot>
    </table>
  </div>
</div>

<script>
  const MAX_PLAYERS = 10;
  let playerCount = 1;
  const headRow = document.getElementById('headRow');
  const tbody   = document.getElementById('tbody');
  const footRow = document.getElementById('footRow');
  let savedNames = [];

  function buildHeader() {
    headRow.innerHTML = '';
    const numTh = document.createElement('th');
    numTh.style.width = '1px';
    numTh.innerHTML = '<div class="row-num">#</div>';
    headRow.appendChild(numTh);
    for (let c = 0; c < playerCount; c++) {
      const th = document.createElement('th');
      th.style.width = 'auto';
      th.innerHTML = `<input class="name-input" placeholder="Spieler ${c + 1}" data-col="${c}" value="${savedNames[c] || ''}">`;
      headRow.appendChild(th);
    }
    headRow.querySelectorAll('.name-input').forEach(inp => {
      inp.addEventListener('input', () => { savedNames[parseInt(inp.dataset.col)] = inp.value; });
    });
  }

  function buildFoot() {
    footRow.innerHTML = '';
    const td0 = document.createElement('td');
    td0.innerHTML = '<div class="row-num" style="font-size:10px;">∑</div>';
    footRow.appendChild(td0);
    for (let c = 0; c < playerCount; c++) {
      const td = document.createElement('td');
      td.innerHTML = `<div class="total-cell zero" id="t${c}">0</div>`;
      footRow.appendChild(td);
    }
  }

  function isRowEmpty(tr) {
    return [...tr.querySelectorAll('.score-input')].every(i => i.value === '');
  }

  function renumber() {
    let n = 0;
    tbody.querySelectorAll('tr').forEach(tr => {
      const num = tr.querySelector('.row-num');
      if (isRowEmpty(tr)) { num.textContent = '…'; tr.classList.add('empty-row'); }
      else { n++; num.textContent = n; tr.classList.remove('empty-row'); }
    });
  }

  function ensureEmptyLast() {
    const rows = [...tbody.querySelectorAll('tr')];
    if (!rows.length || !isRowEmpty(rows[rows.length - 1])) addRow();
    renumber();
  }

  function attachRowEvents(tr) {
    tr.querySelectorAll('.score-input').forEach(inp => {
      inp.addEventListener('input', () => {
        const v = parseFloat(inp.value);
        inp.classList.toggle('neg', !isNaN(v) && v < 0);
        ensureEmptyLast();
        updateTotals();
      });
      inp.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const col = parseInt(inp.dataset.col);
        const nextTr  = col < playerCount - 1 ? tr : tr.nextElementSibling;
        const nextCol = col < playerCount - 1 ? col + 1 : 0;
        const target  = nextTr ? nextTr.querySelectorAll('.score-input')[nextCol] : null;
        if (target) target.focus();
      });
    });
  }

  function addRow() {
    const tr = document.createElement('tr');
    tr.classList.add('empty-row');
    let cells = '<td><div class="row-num">…</div></td>';
    for (let c = 0; c < playerCount; c++) {
      cells += `<td style="width:auto"><input type="number" class="score-input" data-col="${c}" placeholder="—"></td>`;
    }
    tr.innerHTML = cells;
    tbody.appendChild(tr);
    attachRowEvents(tr);
  }

  function updateTotals() {
    const totals = Array(playerCount).fill(0);
    const hasVal = Array(playerCount).fill(false);
    tbody.querySelectorAll('.score-input').forEach(inp => {
      const c = parseInt(inp.dataset.col);
      if (c >= playerCount) return;
      const v = parseFloat(inp.value);
      if (!isNaN(v)) { totals[c] += v; hasVal[c] = true; }
    });
    const ranked = totals
      .map((v, i) => ({ v, i }))
      .filter((_, i) => hasVal[i])
      .sort((a, b) => b.v - a.v);

    for (let c = 0; c < playerCount; c++) {
      const el = document.getElementById('t' + c);
      if (!el) continue;
      const cls = totals[c] > 0 && hasVal[c] ? 'pos'
                : totals[c] < 0 && hasVal[c] ? 'neg' : 'zero';
      el.className = 'total-cell ' + cls;
      const rp = ranked.findIndex(r => r.i === c);
      let badge = '';
      if (rp === 0 && ranked.length > 1) badge = '<span class="rank-badge r1">1</span>';
      else if (rp === 1)                 badge = '<span class="rank-badge r2">2</span>';
      else if (rp === 2)                 badge = '<span class="rank-badge r3">3</span>';
      el.innerHTML = badge + (hasVal[c] ? totals[c] : '0');
    }
  }

  function addPlayerColumn() {
    if (playerCount >= MAX_PLAYERS) return;
    playerCount++;
    buildHeader();
    buildFoot();
    tbody.querySelectorAll('tr').forEach(tr => {
      const c  = playerCount - 1;
      const td = document.createElement('td');
      td.style.cssText = 'width:auto';
      td.innerHTML = `<input type="number" class="score-input" data-col="${c}" placeholder="—">`;
      tr.appendChild(td);
      attachRowEvents(tr);
    });
    if (playerCount >= MAX_PLAYERS) document.getElementById('addPlayerBtn').disabled = true;
    updateTotals();
  }

  function resetScores() {
    if (!confirm('Alle Punkte zurücksetzen? Spielernamen bleiben erhalten.')) return;
    tbody.innerHTML = '';
    buildFoot();
    addRow();
  }

  function resetAll() {
    if (!confirm('Alles zurücksetzen — auch Spielernamen und Spalten?')) return;
    playerCount = 1;
    savedNames  = [];
    tbody.innerHTML = '';
    buildHeader();
    buildFoot();
    addRow();
    document.getElementById('addPlayerBtn').disabled = false;
  }

  document.getElementById('addPlayerBtn').addEventListener('click', addPlayerColumn);
  document.getElementById('resetScoresBtn').addEventListener('click', resetScores);
  document.getElementById('resetAllBtn').addEventListener('click', resetAll);

  buildHeader();
  buildFoot();
  addRow();
</script>
</body>
</html>
